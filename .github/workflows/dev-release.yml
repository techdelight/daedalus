name: Dev Release

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Pre-release Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run tests
        run: go test -v -race ./...

  build:
    name: Build Dev Binary
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="$(cat VERSION)-dev+$(git rev-parse --short HEAD)"
          go build -ldflags="-s -w -X github.com/techdelight/daedalus/core.Version=$VERSION" -o daedalus-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/daedalus
          go build -ldflags="-s -w" -o skill-catalog-mcp-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/skill-catalog-mcp
          go build -ldflags="-s -w" -o project-mgmt-mcp-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/project-mgmt-mcp
          go build -ldflags="-s -w" -o guild-mcp-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/guild-mcp
          go build -ldflags="-s -w" -o guild-control-mcp-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/guild-control-mcp
          go build -ldflags="-s -w" -o daedalus-coordinator-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/daedalus-coordinator
          go build -ldflags="-s -w" -o daedalus-runner-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/daedalus-runner

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            daedalus-${{ matrix.goos }}-${{ matrix.goarch }}
            skill-catalog-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
            project-mgmt-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
            guild-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
            guild-control-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
            daedalus-coordinator-${{ matrix.goos }}-${{ matrix.goarch }}
            daedalus-runner-${{ matrix.goos }}-${{ matrix.goarch }}

  publish:
    name: Create Dev Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release archives
        run: |
          mkdir -p staging release-assets
          # Collect every per-platform binary from the matrix artifacts into a
          # single flat staging dir.
          cp artifacts/binaries-*/* staging/
          # Stage the shared runtime files (exactly what setup.sh installs) plus
          # wsl2-network.bat.
          cp claude.json config.json docker-compose.yml Dockerfile entrypoint.sh settings.json logo.txt setup.sh staging/
          cp scripts/wsl2-network.bat staging/
          # Bake a timestamped dev version into config.json via the packager.
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          bash scripts/package-release.sh --staging staging --out release-assets --version "dev_$TIMESTAMP"
          # Ship a standalone install.sh with the dev tag baked in.
          cp install.sh release-assets/install.sh
          sed -i 's/RELEASE_TAG="__RELEASE_TAG__"/RELEASE_TAG="dev"/' release-assets/install.sh

      - name: Delete existing dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev --yes --cleanup-tag 2>/dev/null || true
          sleep 2

      - name: Create dev pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create dev \
            --title "Dev Build (${{ github.event.head_commit.timestamp || 'manual' }})" \
            --prerelease \
            --target "${{ github.sha }}" \
            --notes "$(cat <<'EOF'
          ## Rolling Dev Build

          This is an **automated pre-release** built from the latest `development` branch.
          It may be unstable — use a [stable release](https://github.com/techdelight/daedalus/releases/latest) for production.

          **Commit:** ${{ github.sha }}
          **Compare:** [Changes since last release](https://github.com/techdelight/daedalus/compare/...development)

          ### Install

          ```bash
          curl -fsSL https://github.com/techdelight/daedalus/releases/download/dev/install.sh | bash
          ```

          This downloads the dev release archive, verifies its checksum, extracts the binaries + runtime files, and creates a PATH symlink. See `install.sh --help` for options.
          EOF
          )" \
            release-assets/*
