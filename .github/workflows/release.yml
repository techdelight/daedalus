# Copyright (C) 2026 Techdelight BV

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Pre-release Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run tests
        run: go test -v -race ./...

  release:
    name: Build & Release
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=$(cat VERSION)
          go build -ldflags="-s -w -X github.com/techdelight/daedalus/core.Version=$VERSION" -o daedalus-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/daedalus
          go build -ldflags="-s -w" -o skill-catalog-mcp-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/skill-catalog-mcp
          go build -ldflags="-s -w" -o project-mgmt-mcp-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/project-mgmt-mcp
          go build -ldflags="-s -w" -o guild-mcp-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/guild-mcp
          go build -ldflags="-s -w" -o daedalus-coordinator-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/daedalus-coordinator
          go build -ldflags="-s -w" -o daedalus-control-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/daedalus-control
          go build -ldflags="-s -w" -o daedalus-runner-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/daedalus-runner

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            daedalus-${{ matrix.goos }}-${{ matrix.goarch }}
            skill-catalog-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
            project-mgmt-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
            guild-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
            daedalus-coordinator-${{ matrix.goos }}-${{ matrix.goarch }}
            daedalus-control-${{ matrix.goos }}-${{ matrix.goarch }}
            daedalus-runner-${{ matrix.goos }}-${{ matrix.goarch }}

  publish:
    name: Create GitHub Release
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release archives
        run: |
          VERSION=$(cat VERSION)
          mkdir -p staging release-assets
          # Collect every per-platform binary from the matrix artifacts into a
          # single flat staging dir (daedalus-<os>-<arch>, skill-catalog-mcp-...,
          # project-mgmt-mcp-..., daedalus-coordinator-..., daedalus-runner-...).
          cp artifacts/binaries-*/* staging/
          # Stage the shared runtime files (exactly what setup.sh installs) plus
          # wsl2-network.bat. package-release.sh bakes $VERSION into config.json.
          cp claude.json config.json docker-compose.yml Dockerfile entrypoint.sh settings.json logo.txt setup.sh staging/
          cp scripts/wsl2-network.bat staging/
          # Build one daedalus-<os>-<arch>.tar.gz per platform + SHA256SUMS.txt.
          bash scripts/package-release.sh --staging staging --out release-assets --version "$VERSION"
          # Ship a standalone install.sh with the release tag baked in.
          cp install.sh release-assets/install.sh
          sed -i 's/RELEASE_TAG="__RELEASE_TAG__"/RELEASE_TAG="${{ github.ref_name }}"/' release-assets/install.sh

      - name: Extract changelog
        id: changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          CHANGELOG=$(bash scripts/extract-changelog.sh "$VERSION")
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.changelog }}

            ---
            **Full Changelog**: See [CHANGELOG.md](https://github.com/techdelight/daedalus/blob/master/CHANGELOG.md)
            **Install**: `curl -fsSL https://raw.githubusercontent.com/techdelight/daedalus/master/install.sh | bash`
          files: release-assets/*
